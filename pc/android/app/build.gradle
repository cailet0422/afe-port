// Android build of the PC port (docs/android.md).
//
// Needs the SDL2 source tree (its Java glue and native library): put it in
// pc/android/SDL or pass -PsdlDir=/path/to/SDL2-2.30.x.
plugins {
    id 'com.android.application'
}

def sdlDir = file(project.findProperty('sdlDir') ?: "${rootDir}/SDL")
// -PstripAssets: leave the extracted assets out of the library; it reads them
// from the disc at start (PC_STRIP_ASSETS, docs/README.md)
def stripAssets = project.hasProperty('stripAssets') ? 'ON' : 'OFF'
def assetDir = file("${buildDir}/generated/afe_assets")
// Release signing: a keystore.properties (storeFile, storePassword, keyAlias,
// keyPassword; storeFile relative to that file) at pc/android/release-key/,
// or the one -PreleaseKeyProps=/path/keystore.properties names. Without one
// the release APK is signed with the debug key, as before. Never commit it.
def releaseKeyProps = file(project.findProperty('releaseKeyProps') ?: "${rootDir}/release-key/keystore.properties")
def releaseKey = new Properties()
if (releaseKeyProps.exists()) {
    releaseKeyProps.withInputStream { releaseKey.load(it) }
}

android {
    namespace 'org.afedecomp.dobutsunomori'
    compileSdk 34
    ndkVersion '27.2.12479018'

    defaultConfig {
        applicationId 'org.afedecomp.dobutsunomori'
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName '0.1'
        ndk {
            // Many recent phones run only 64-bit apps (docs/64bit.md)
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }
        externalNativeBuild {
            cmake {
                arguments "-DSDL_SOURCE_DIR=${sdlDir}",
                          "-DPC_ANDROID_ASSET_DIR=${assetDir}",
                          '-DPC_ALLOW_64BIT=ON',
                          "-DPC_STRIP_ASSETS=${stripAssets}",
                          '-DANDROID_STL=c++_shared'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path 'jni/CMakeLists.txt'
            version '3.22.1'
        }
    }

    sourceSets {
        main {
            java.srcDirs += "${sdlDir}/android-project/app/src/main/java"
            assets.srcDirs += assetDir
        }
    }

    signingConfigs {
        if (releaseKeyProps.exists()) {
            release {
                storeFile new File(releaseKeyProps.parentFile, releaseKey['storeFile'])
                storePassword releaseKey['storePassword']
                keyAlias releaseKey['keyAlias']
                keyPassword releaseKey['keyPassword']
            }
        }
    }

    buildTypes {
        debug {
            // The decomp is built without optimization (see pc/CMakeLists.txt)
            debuggable true
        }
        release {
            minifyEnabled false
            signingConfig releaseKeyProps.exists() ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }
}

// The native build writes the shaders and the REL overlay table that go into
// the assets, so it has to run first.
tasks.configureEach { task ->
    def m = task.name =~ /^merge(\w+)Assets$/
    if (m) {
        task.dependsOn "externalNativeBuild${m[0][1]}"
    }
}
