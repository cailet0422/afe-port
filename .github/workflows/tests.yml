name: Tests

# The game itself needs a disc image to build, so CI only runs what does not:
# the unit tests of the port layer and a syntax check of the tools.
on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v5
      with:
        submodules: true # the decomp, for the SDK types the card test uses

    - name: Install
      # gcc-multilib and pyelftools: the save swap table check below
      run: sudo apt-get update && sudo apt-get install -y ninja-build gcc-multilib python3-pyelftools

    - name: Build
      run: |
        cmake -S pc -B build-tests -G Ninja -DPC_TESTS_ONLY=ON
        ninja -C build-tests

    - name: Test
      run: ctest --test-dir build-tests --output-on-failure

    - name: Tools
      run: python3 -m py_compile pc/tools/*.py

    # The GCI conversion's field table is generated from the e+ headers; it must
    # match them (pc/tools/gen_save_swap.py writes it again if not)
    - name: Save swap table
      run: python3 pc/tools/gen_save_swap.py --check

    # The minimap's acre tables are copied from the decomp's m_map_ovl.c
    - name: Minimap tables
      run: python3 pc/tools/gen_minimap_tables.py --check
